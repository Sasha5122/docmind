[project]
name = "docmind"
version = "0.1.0"
description = "Underwriting & compliance document assistant: multilingual RAG with citations, PII redaction, audit trail and an evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "langdetect>=1.0.9",
    "openai>=3.6.0",
    "pgvector>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0",
    "tiktoken>=0.7",
    "xx-ent-wiki-sm",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, UP = modern syntax, B = common bugs
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/download_corpus.py" = ["E501"]  # one URL per line is more readable than wrapped URLs

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }
