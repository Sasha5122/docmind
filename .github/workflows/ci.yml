name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
      LLM_BACKEND: ollama  # never a cloud key in unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU torch on Linux, see pyproject [tool.uv.sources])
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Unit + DB tests
        run: uv run pytest -q
      - name: Eval regression gate (committed reports)
        run: uv run python -m docmind.eval.gate reports/baseline.json reports/latest.json --max-drop 5
